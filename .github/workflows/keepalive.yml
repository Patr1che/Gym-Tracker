# Render's free tier spins a service down after ~15 minutes idle, and a JVM waking on
# 0.1 CPU is slow. The free allowance is 750 instance-hours against roughly 720 hours in
# a month, so a ping every 10 minutes keeps the service warm and still fits the budget.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # Set this to the Render URL, e.g. https://gymtracker-api.onrender.com
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL secret not set - skipping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 3 --retry-delay 20 "$API_URL/actuator/health"

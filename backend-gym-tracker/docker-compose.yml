services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymtracker
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gymtracker"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes: { pgdata: }

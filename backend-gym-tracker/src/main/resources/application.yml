spring:
  application:
    name: gymtracker-api
  # Unset locally, which selects the logging sender in MailConfig - the flow works end to
  # end without a provider, with the link written to the log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # JavaMail defaults every one of these to infinite. Without them a provider
      # that accepts the TCP connection and then stalls blocks the sending thread
      # for good - which is exactly how a slow SMTP host took the whole API down:
      # sends were made inside the registration transaction, so each hung send
      # held a database connection until the pool was empty and every query,
      # health checks included, queued behind it.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/gymtracker}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
    hikari:
      maximum-pool-size: 5      # Neon's free tier caps connections
      # minimum-idle: 0 is the whole point. Neon suspends the compute after 5 minutes
      # with no client, but a pooled connection held open is a client, so the old
      # minimum-idle: 1 kept the database awake around the clock and would have spent
      # the month's 100 CU-hours in about 17 days. Draining the pool lets it sleep.
      minimum-idle: 0
      idle-timeout: 30000       # release a spare connection after 30s
      max-lifetime: 600000      # 10 min, under Neon's own connection cap
      # keepalive-time is deliberately unset: it pings the database on a timer, which is
      # exactly the wake-up this configuration exists to avoid.
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema - never 'update'
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # Compute time on Neon is billed by the wall clock, so round trips are the cost to
      # cut. Syncing a workout inserts one log, its exercises and every set; batching
      # sends those as a few statements instead of dozens. Requires the entities' SEQUENCE
      # ids - Hibernate silently disables batching for IDENTITY.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8097}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info    # never env or heapdump
  endpoint:
    health:
      probes:
        enabled: true
      # Render polls the health check continuously, and the default /actuator/health
      # includes Spring's db indicator - meaning every poll ran a query and kept Neon's
      # compute awake permanently. Splitting the groups lets render.yaml point its check
      # at liveness, which touches nothing, while readiness still reports on the
      # database for when it is asked directly.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-locally-only-min-32-bytes-long-abcdef}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5555}
  mail:
    # Must be the address verified in Brevo, or the provider rejects the send.
    from: ${MAIL_FROM:no-reply@gymtracker.local}
    from-name: ${MAIL_FROM_NAME:GymTracker}
    # This API's own public base URL. The verification link is opened in a browser and
    # must come back here - it is not an app deep link.
    public-url: ${PUBLIC_URL:http://localhost:8097}
    code-ttl-minutes: 10
    resend-cooldown-minutes: 5
  housekeeping:
    # How long a tombstone survives before the row is deleted for good. Long enough that
    # a device offline for a season still receives the deletion in a pull; short enough
    # that deleted data is not stored forever. Lower it and a device that was away longer
    # than this keeps records everyone else deleted.
    tombstone-retention-days: 90

logging:
  level:
    org.flywaydb: INFO
